<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator - FortuneFlip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; padding-bottom: 20px; }
        
        /* Game Canvas */
        .game-area {
            height: 300px;
            background: radial-gradient(circle at bottom, #1e293b 0%, #020617 100%);
            position: relative;
            border-bottom: 4px solid #334155;
            overflow: hidden;
        }
        
        /* Stars Animation */
        .star-layer {
            position: absolute; width: 200%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.4; animation: moveStars 40s linear infinite;
            will-change: transform;
        }
        @keyframes moveStars { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* Plane & Multiplier */
        #plane {
            position: absolute; bottom: 20px; left: 20px; width: 80px;
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.6));
            z-index: 10; will-change: transform; transition: transform 0.1s linear;
        }
        .multiplier-text {
            font-size: 3.5rem; font-weight: 900;
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            font-variant-numeric: tabular-nums;
        }
        .crashed-text { color: #ef4444; animation: shake 0.5s; text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
        @keyframes shake { 0%, 100% { transform: translate(-50%, -50%); } 25% { transform: translate(-52%, -50%); } 75% { transform: translate(-48%, -50%); } }

        /* Tabs */
        .tab-btn { padding: 12px; font-size: 14px; color: #64748b; border-bottom: 2px solid transparent; transition: all 0.3s; flex: 1; }
        .tab-btn.active { color: #ef4444; border-bottom: 2px solid #ef4444; font-weight: bold; background: rgba(239, 68, 68, 0.05); }
        
        /* Toast */
        #toast { visibility: hidden; min-width: 250px; margin-left: -125px; background-color: #333; color: #fff; text-align: center; border-radius: 50px; padding: 14px 20px; position: fixed; z-index: 100; left: 50%; bottom: 50px; border: 1px solid #475569; }
        #toast.show { visibility: visible; animation: fadeIn 0.5s, fadeOut 0.5s 2.5s; }
        @keyframes fadeIn { from { bottom: 0; opacity: 0; } to { bottom: 50px; opacity: 1; } }
        @keyframes fadeOut { from { bottom: 50px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative flex flex-col">

    <div id="toast">Message</div>

    <div class="p-4 bg-[#0f172a] flex justify-between items-center border-b border-gray-800 z-20">
        <button onclick="window.location.href='index.html'"><i class="fas fa-chevron-left text-gray-400"></i></button>
        <div class="flex items-center gap-2">
            <i class="fas fa-plane-departure text-red-500"></i>
            <h1 class="font-bold text-lg text-red-500 tracking-wide">AVIATOR</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleMute()" id="soundBtn" class="text-yellow-400"><i class="fas fa-volume-up"></i></button>
            <div class="bg-gray-800 px-4 py-1.5 rounded-full text-sm font-bold border border-green-500/30 text-green-400">
                ₹ <span id="balance">...</span>
            </div>
        </div>
    </div>

    <div class="px-4 py-2 bg-[#1e293b] flex gap-2 overflow-x-auto no-scrollbar border-b border-gray-700" id="historyBar">
        <span class="text-[10px] text-gray-500 self-center mr-1 font-bold">LAST:</span>
    </div>

    <div class="game-area">
        <div class="star-layer"></div>
        <div id="multiplier" class="multiplier-text text-white">1.00x</div>
        <p id="statusMsg" class="absolute top-[65%] left-1/2 -translate-x-1/2 text-gray-400 text-xs font-mono bg-black/40 px-3 py-1 rounded-full backdrop-blur-sm hidden whitespace-nowrap">CONNECTING...</p>
        
        <svg class="absolute bottom-0 left-0 w-full h-full pointer-events-none opacity-60">
            <path id="curve" d="M0 300 Q 0 300 0 300" stroke="#ef4444" stroke-width="4" fill="none"></path>
        </svg>
        <img id="plane" src="https://cdn-icons-png.flaticon.com/512/7893/7893979.png" alt="Plane">
    </div>

    <div class="p-4 bg-[#0f172a] relative z-20">
        <div class="flex gap-2 mb-4">
            <div class="bg-[#1e293b] rounded-2xl p-1 flex items-center flex-1 border border-gray-700">
                <button onclick="adjBet(-10)" class="w-12 h-12 rounded-xl bg-gray-800 text-gray-400 hover:bg-gray-700 font-bold text-xl">-</button>
                <input type="number" id="betAmount" value="10" class="bg-transparent text-center w-full font-bold text-2xl outline-none text-white">
                <button onclick="adjBet(10)" class="w-12 h-12 rounded-xl bg-gray-800 text-gray-400 hover:bg-gray-700 font-bold text-xl">+</button>
            </div>
        </div>
        <div class="flex justify-between mb-4 gap-2">
            <button onclick="setBet(100)" class="flex-1 bg-gray-800 py-2 rounded-lg text-xs font-bold text-gray-400">100</button>
            <button onclick="setBet(500)" class="flex-1 bg-gray-800 py-2 rounded-lg text-xs font-bold text-gray-400">500</button>
            <button onclick="setBet(1000)" class="flex-1 bg-gray-800 py-2 rounded-lg text-xs font-bold text-gray-400">1000</button>
            <button onclick="setBet(5000)" class="flex-1 bg-gray-800 py-2 rounded-lg text-xs font-bold text-gray-400">5k</button>
        </div>
        <button id="actionBtn" onclick="handleAction()" class="w-full py-4 rounded-2xl text-xl font-black text-white uppercase tracking-widest shadow-[0_6px_0_#166534] bg-green-600 transition-all active:translate-y-1 active:shadow-none">
            BET NEXT ROUND
        </button>
    </div>

    <div class="bg-[#1e293b] flex-1 rounded-t-3xl mt-2 flex flex-col min-h-[300px]">
        <div class="flex border-b border-gray-700 shrink-0">
            <button onclick="switchTab('all')" id="tab-all" class="tab-btn active">All Players</button>
            <button onclick="switchTab('my')" id="tab-my" class="tab-btn">My Bets</button>
        </div>
        
        <div id="view-all" class="p-0 overflow-y-auto flex-1 max-h-[350px]">
            <table class="w-full text-left text-xs text-gray-400">
                <thead class="bg-gray-800 text-gray-500 font-bold uppercase sticky top-0">
                    <tr><th class="p-3">User</th><th class="p-3">Bet</th><th class="p-3 text-right">Cash out</th></tr>
                </thead>
                <tbody id="allBetsList" class="divide-y divide-gray-700"></tbody>
            </table>
        </div>

        <div id="view-my" class="p-4 space-y-2 overflow-y-auto flex-1 max-h-[350px] hidden">
            <p class="text-center text-gray-500 text-sm mt-4">Loading...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, runTransaction, updateDoc, increment, collection, addDoc, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvuTedi4hNLDTHwNt3tElmZZmwmxBC_zo",
            authDomain: "rupeedesk7.firebaseapp.com",
            projectId: "rupeedesk7",
            storageBucket: "rupeedesk7.firebasestorage.app",
            messagingSenderId: "1013963357851",
            appId: "1:1013963357851:android:89d07511ca0da5fded503e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        let currentBalance = 0;

        // SOUNDS
        let isMuted = false;
        const sounds = {
            fly: new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3'), // Engine
            crash: new Audio('https://assets.mixkit.co/active_storage/sfx/1705/1705-preview.mp3'), // Explosion
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'), // Coins
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3') // Click
        };
        sounds.fly.loop = true;
        sounds.fly.volume = 0.5;

        // Game State
        let gameState = 'IDLE'; 
        let isBettingNext = false; 
        let currentBetDocId = null; 
        let myBetAmount = 0;
        let currentMultiplier = 1.00;
        let crashPoint = 0;
        let timerInterval;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (d) => {
                    currentBalance = d.data().balance;
                    document.getElementById('balance').innerText = currentBalance.toFixed(2);
                });
                loadMyHistory(user.uid);
                startFakeBots(); 
                startGameLoop();
            } else window.location.href = "login.html";
        });

        // --- AUDIO MANAGER ---
        window.toggleMute = () => {
            isMuted = !isMuted;
            const icon = document.querySelector('#soundBtn i');
            icon.className = isMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
            icon.parentElement.className = isMuted ? 'text-gray-500' : 'text-yellow-400';
            if(isMuted) sounds.fly.pause();
        };
        function playSfx(key) {
            if(!isMuted) {
                if(key !== 'fly') sounds[key].currentTime = 0;
                sounds[key].play().catch(e=>{});
            }
        }
        function stopSfx(key) {
            sounds[key].pause();
            sounds[key].currentTime = 0;
        }

        // --- GAME ENGINE ---
        function startGameLoop() {
            if(timerInterval) clearInterval(timerInterval);
            stopSfx('fly'); // Ensure engine stops
            gameState = 'WAITING';
            resetGameUI();
            
            let countdown = 5;
            updateStatus(`NEXT ROUND IN ${countdown}s`);
            
            if(isBettingNext) updateBtnState('waiting'); 
            else updateBtnState('bet');

            const cdInterval = setInterval(() => {
                countdown--;
                updateStatus(`NEXT ROUND IN ${countdown}s`);
                if (countdown <= 0) {
                    clearInterval(cdInterval);
                    startFlight();
                }
            }, 1000);
        }

        async function startFlight() {
            gameState = 'FLYING';
            document.getElementById('statusMsg').classList.add('hidden');
            playSfx('fly'); // Start Engine
            
            if(isBettingNext) {
                myBetAmount = parseFloat(document.getElementById('betAmount').value);
                if(currentBalance < myBetAmount) {
                    showToast("Insufficient Balance");
                    isBettingNext = false;
                    updateBtnState('disabled');
                } else {
                    await placeBetDb(myBetAmount);
                    updateBtnState('cashout');
                }
            } else {
                updateBtnState('disabled');
            }

            // Smart Crash Logic
            if(myBetAmount > 500) crashPoint = (Math.random() * 0.4) + 1.1; 
            else if (myBetAmount > 0) crashPoint = (Math.random() * 2.0) + 1.5; 
            else {
                crashPoint = (Math.random() * 5) + 1; 
                if(Math.random() > 0.8) crashPoint += 10; 
            }
            
            let time = 0;
            currentMultiplier = 1.00;
            
            timerInterval = setInterval(() => {
                time += 0.05;
                currentMultiplier = 1.00 + (Math.pow(time, 2) / 20); 
                updateVisuals(currentMultiplier);
                if (currentMultiplier >= crashPoint) crashPlane();
            }, 50);
        }

        function crashPlane() {
            clearInterval(timerInterval);
            stopSfx('fly');
            playSfx('crash');
            
            gameState = 'CRASHED';
            isBettingNext = false; 
            currentBetDocId = null;

            const mText = document.getElementById('multiplier');
            mText.classList.add('crashed-text');
            mText.innerText = "FLEW AWAY";
            
            updateStatus(`CRASHED @ ${currentMultiplier.toFixed(2)}x`);
            addHistoryPill(currentMultiplier.toFixed(2));
            loadMyHistory(currentUser.uid); 
            
            updateBtnState('bet');
            setTimeout(startGameLoop, 4000);
        }

        async function placeBetDb(amt) {
            await runTransaction(db, async (t) => {
                const uRef = doc(db, "users", currentUser.uid);
                t.update(uRef, { balance: increment(-amt) });
                const betRef = doc(collection(db, "bets"));
                currentBetDocId = betRef.id;
                t.set(betRef, {
                    userId: currentUser.uid, game: 'aviator', amount: amt, status: 'running', multiplier: 0, timestamp: new Date()
                });
            });
        }

        async function cashOutDb() {
            playSfx('win');
            const winAmt = myBetAmount * currentMultiplier;
            await runTransaction(db, async (t) => {
                const uRef = doc(db, "users", currentUser.uid);
                const betRef = doc(db, "bets", currentBetDocId);
                t.update(uRef, { balance: increment(winAmt) });
                t.update(betRef, { status: 'win', multiplier: currentMultiplier, profit: winAmt });
            });
            showToast(`Won ₹${winAmt.toFixed(2)}`);
        }

        function updateVisuals(mult) {
            document.getElementById('multiplier').innerText = mult.toFixed(2) + "x";
            const plane = document.getElementById('plane');
            const bottom = Math.min(mult * 20, 220);
            const left = Math.min(mult * 40, window.innerWidth - 100);
            plane.style.transform = `translate(${left}px, -${bottom}px)`;
            
            const curve = document.getElementById('curve');
            curve.setAttribute("d", `M0 300 Q ${left/2} 300, ${left} ${300 - bottom}`);
        }

        window.handleAction = async () => {
            playSfx('click');
            if(gameState === 'WAITING' || gameState === 'CRASHED') {
                if(isBettingNext) { isBettingNext = false; updateBtnState('bet'); } 
                else { isBettingNext = true; updateBtnState('waiting'); }
            } else if(gameState === 'FLYING') {
                if(currentBetDocId) {
                    await cashOutDb();
                    currentBetDocId = null;
                    updateBtnState('won');
                }
            }
        };

        function updateBtnState(state) {
            const btn = document.getElementById('actionBtn');
            btn.className = "w-full py-4 rounded-2xl text-xl font-black text-white uppercase tracking-widest transition-all active:translate-y-1 active:shadow-none";
            btn.disabled = false;

            if(state === 'bet') {
                btn.innerText = "BET NEXT ROUND";
                btn.classList.add('bg-green-600', 'shadow-[0_6px_0_#166534]');
            } else if(state === 'waiting') {
                btn.innerText = "CANCEL BET";
                btn.classList.add('bg-red-600', 'shadow-[0_6px_0_#991b1b]');
            } else if(state === 'cashout') {
                btn.innerText = "CASH OUT";
                btn.classList.add('bg-yellow-400', 'text-black', 'shadow-[0_6px_0_#ca8a04]');
            } else if(state === 'won') {
                btn.innerText = "WINNER!";
                btn.classList.add('bg-green-500', 'opacity-80');
                btn.disabled = true;
            } else if(state === 'disabled') {
                btn.innerText = "WAIT FOR NEXT ROUND";
                btn.classList.add('bg-gray-800', 'text-gray-500', 'border', 'border-gray-700', 'text-sm');
                btn.disabled = true;
            }
        }

        function resetGameUI() {
            document.getElementById('plane').style.transform = "translate(0,0)";
            document.getElementById('multiplier').classList.remove('crashed-text');
            document.getElementById('multiplier').innerText = "1.00x";
            document.getElementById('curve').setAttribute("d", "M0 300 Q 0 300 0 300");
        }

        function updateStatus(msg) {
            const el = document.getElementById('statusMsg');
            el.innerText = msg; el.classList.remove('hidden');
        }

        function addHistoryPill(val) {
            const bar = document.getElementById('historyBar');
            const pill = document.createElement('div');
            const isHigh = parseFloat(val) >= 2.00;
            pill.className = `shrink-0 px-3 py-1 rounded-md text-xs font-bold mr-2 ${isHigh ? 'bg-green-500/20 text-green-400 border border-green-500/50' : 'bg-gray-700 text-gray-400'}`;
            pill.innerText = val + "x";
            bar.prepend(pill);
        }

        window.switchTab = (tab) => {
            playSfx('click');
            document.getElementById('view-all').classList.add('hidden');
            document.getElementById('view-my').classList.add('hidden');
            document.getElementById('tab-all').classList.remove('active');
            document.getElementById('tab-my').classList.remove('active');
            document.getElementById('view-'+tab).classList.remove('hidden');
            document.getElementById('tab-'+tab).classList.add('active');
        };

        function loadMyHistory(uid) {
            const q = query(collection(db, "bets"), where("userId", "==", uid), where("game", "==", "aviator"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('view-my');
                list.innerHTML = "";
                const docs = [];
                snap.forEach(d => docs.push(d.data()));
                docs.sort((a, b) => b.timestamp.seconds - a.timestamp.seconds);

                if(docs.length === 0) list.innerHTML = '<p class="text-center text-gray-500 text-sm mt-4">No bets yet.</p>';

                docs.forEach(data => {
                    const color = data.status === 'win' ? 'text-green-400' : (data.status === 'running' ? 'text-yellow-400' : 'text-red-400');
                    const profitText = data.status === 'win' ? '+' + data.profit.toFixed(0) : (data.status==='running'?'...':'-'+data.amount);
                    
                    list.innerHTML += `
                    <div class="bg-[#0f172a] p-3 rounded-xl flex justify-between items-center border border-gray-800">
                        <div><p class="text-xs text-gray-500">${new Date(data.timestamp.seconds*1000).toLocaleTimeString()}</p><p class="font-bold text-white text-sm">Bet: ₹${data.amount}</p></div>
                        <div class="text-right"><p class="font-bold ${color} text-lg">${profitText}</p><p class="text-[10px] text-gray-500">Cashout: ${data.multiplier ? data.multiplier.toFixed(2)+'x' : '-'}</p></div>
                    </div>`;
                });
            });
        }

        function startFakeBots() {
            const list = document.getElementById('allBetsList');
            const names = ["User88*", "King**", "Pro**99", "Dev**01", "Ravi**", "Amit**", "Sky**", "Lion**"];
            
            setInterval(() => {
                if(gameState !== 'FLYING') return;
                if(Math.random() > 0.6) {
                    const name = names[Math.floor(Math.random()*names.length)];
                    const bet = (Math.floor(Math.random() * 50) + 1) * 10;
                    const mult = (Math.random() * 2 + 1).toFixed(2);
                    const win = (bet * mult).toFixed(0);
                    const row = `<tr class="border-b border-gray-800 animate-pulse bg-green-900/20"><td class="p-3 text-white">${name}</td><td class="p-3">₹${bet}</td><td class="p-3 text-right text-green-400 font-bold">${mult}x (+${win})</td></tr>`;
                    list.insertAdjacentHTML('afterbegin', row);
                    if(list.children.length > 15) list.lastChild.remove();
                }
            }, 800);
        }

        window.showToast = (msg) => { const x = document.getElementById("toast"); x.innerText = msg; x.className = "show"; setTimeout(() => { x.className = x.className.replace("show", ""); }, 3000); };
        window.setBet = (n) => { playSfx('click'); document.getElementById('betAmount').value = n; };
        window.adjBet = (n) => { playSfx('click'); let v = parseInt(document.getElementById('betAmount').value) + n; if(v<10) v=10; document.getElementById('betAmount').value = v; };
    </script>
</body>
</html>
